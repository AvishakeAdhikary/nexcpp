version: "3.9"

services:
  nexcpp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nexcpp:latest
    container_name: nexcpp
    ports:
      - "7777:7777"
    environment:
      NEXCPP_TRANSPORT: sse
      NEXCPP_GITHUB_TOKEN: ${NEXCPP_GITHUB_TOKEN:-}
      VCPKG_ROOT: /opt/vcpkg
    volumes:
      - nexcpp-docs:/nexcpp/docs_mirror
      - vcpkg-cache:/opt/vcpkg/installed
      - ${HOME:-${USERPROFILE}}/.nexcpp/logs:/root/.nexcpp/logs
    command: ["--transport", "sse", "--host", "0.0.0.0", "--port", "7777"]
    restart: unless-stopped

volumes:
  nexcpp-docs:
  vcpkg-cache:
